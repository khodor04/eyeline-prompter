server {
    listen 80;
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Allow camera + microphone for this site
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;

    location ~* \.webmanifest$ {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Always fetch the newest app code / service worker
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    }

    # Speech models: large and versioned by file name, so cache them hard
    location ^~ /models/ {
        types { }
        default_type application/gzip;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location /.well-known/ {
        types { }
        default_type application/json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
